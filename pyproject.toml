[project]
name = "hn-rewrite"
version = "0.1.0"
description = "Minimalist HN reranking dashboard"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.1",
    "flask>=3.1",
    "httpx>=0.28",
    "beautifulsoup4>=4.14",
    "trafilatura>=1.6",
    "justext>=3.0",
    "numpy<2.4",
    "onnxruntime>=1.23",
    "transformers>=4.57",
    "scikit-learn>=1.8",
    "jinja2>=3.1",
    "feedparser>=6.0",
]

[dependency-groups]
browser = [
    "playwright>=1.63.0",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "hypothesis>=6.150",
    "pytest-xdist>=3.6",
    "ruff>=0.14",
    "ty>=0.0.10",
    "hn-rerank",
]
embedding-experiment = [
    "huggingface-hub>=0.25",
    "openvino>=2025.0",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: slow tests (~60s); run with `pytest -m slow`",
    "browser: headless-Chrome page tests; `uv run --group browser pytest -m browser`",
]
addopts = "-m 'not slow and not browser'"

[tool.uv.workspace]
members = [
    "clients/tui",
]

[tool.uv.sources]
hn-rerank = { workspace = true }
